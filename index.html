<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Metódo Pomodoro</title>
</head>
<body>
    <div class="container-timer">
        <h2 id="timer">25:00</h2>

        <div class="timer-buttons">
            <button id="iniciar-timer">
                <span id="icone-iniciar">▶</span>
                <span id="texto-iniciar">Iniciar</span>
            </button>

            <button id="resetar-timer">
                <span>↻</span>
                <span>Reiniciar</span>
            </button>

            <button id="configurar-timer">
                <img src="img/settings.svg" alt="Configurar">
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
