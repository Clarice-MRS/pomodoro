<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Metódo Pomodoro</title>
</head>
<body>
    <div class="container-timer">
        <button id="configurar-timer">
            <img src="img/settings.svg" alt="configurar">
        </button>
        <h2 id="timer">25:00</h2>
        <button onclick="iniciarContagem()"  id="iniciar-timer">
          <img src="img/play.svg" alt="iniciar">
        </button>
        <button id="resetar-timer">
            <img src="img/stop.svg" alt="parar">
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
